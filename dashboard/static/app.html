<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap; z-index:999;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── ARC REACTOR HERO ── */
    #reactor-wrap {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 0 8px; background: radial-gradient(circle at center, rgba(99,102,241,0.09) 0%, rgba(7,9,15,0.98) 78%);
      border-bottom: 1px solid var(--border); position: relative;
    }
    #jarvis-canvas {
      width: 220px; height: 160px; display: block; cursor: pointer;
    }
    #reactor-status {
      font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.5); margin-top: 2px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    /* ── SCREEN VIEW PANEL ── */
    #screen-panel {
      display: none; flex-shrink: 0; background: #04060a; border-bottom: 1px solid var(--border);
      padding: 10px; text-align: center; position: relative;
    }
    .scr-tools {
      display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px;
    }
    .scr-tools::-webkit-scrollbar { height: 2px; }
    .scr-tools::-webkit-scrollbar-thumb { background: var(--border); }
    .scr-img-box {
      position: relative; display: inline-block; max-width: 100%; overflow: hidden;
      border-radius: 8px; border: 1px solid var(--border); background: #000;
    }
    #screen-img {
      width: 100%; max-height: 48vh; object-fit: contain; display: block;
      user-select: none; -webkit-user-drag: none; cursor: crosshair;
    }
    #touch-marker {
      position: absolute; width: 22px; height: 22px; border: 2px solid #00d4ff;
      border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
      display: none; box-shadow: 0 0 12px #00d4ff; background: rgba(0,212,255,0.2);
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <button id="spk-btn" class="pill on" onclick="toggleSpeaker()" title="Toggle Phone Voice" style="cursor:pointer; user-select:none; font-size:11px;">🔊 <span id="spk-txt">Voice ON</span></button>
    <button id="scr-btn" class="pill" onclick="toggleScreenView()" title="Toggle PC Screen Remote Control" style="cursor:pointer; user-select:none; font-size:11px;">🖥️ <span id="scr-txt">Screen View</span></button>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <div id="reactor-wrap">
    <canvas id="jarvis-canvas" width="320" height="220" title="Tap Arc Reactor for voice command"></canvas>
    <div id="reactor-status">JARVIS ONLINE</div>
  </div>
  <div id="screen-panel">
    <input id="virtual-kbd-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; top:0; left:0;">
    <div class="scr-tools">
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="setTouchMode('left')">🖱️ Left Click</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="setTouchMode('right')">🖱️ Right Click</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="setTouchMode('double')">✌️ Double Click</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="setTouchMode('drag')">🖐️ Drag & Drop</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="sendScreenKey('win')">⊞ Win</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="sendScreenKey('alt+tab')">↹ Alt+Tab</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="sendScreenScroll('up')">🔼 Scroll Up</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="sendScreenScroll('down')">🔽 Scroll Down</button>
      <button class="btn btn-wake show" style="font-size:10px; padding:6px 10px;" onclick="focusMobileKeyboard()">⌨️ Keyboard</button>
    </div>
    <div class="scr-img-box">
      <img id="screen-img" src="" alt="Live PC Screen">
      <div id="touch-marker"></div>
    </div>
  </div>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── Mobile Audio Control ──────────────────────────────────────────────────
    let _speakerEnabled = true;

    function toggleSpeaker() {
      _speakerEnabled = !_speakerEnabled;
      const btn = document.getElementById('spk-btn');
      const txt = document.getElementById('spk-txt');
      if (_speakerEnabled) {
        btn.className = 'pill on';
        txt.textContent = 'Voice ON';
        btn.firstChild.textContent = '🔊 ';
        toast('Phone Voice Enabled');
        unlockAudio();
      } else {
        btn.className = 'pill';
        txt.textContent = 'Voice OFF';
        btn.firstChild.textContent = '🔇 ';
        clearPcmAudio();
        toast('Phone Voice Muted');
      }
    }

    function unlockAudio() {
      _initPcmContext();
    }

    // ── JARVIS Arc Reactor Animation Engine ──────────────────────────────────
    const rCanvas = document.getElementById('jarvis-canvas');
    const rCtx    = rCanvas ? rCanvas.getContext('2d') : null;
    const rStatus = document.getElementById('reactor-status');

    let _rState     = 'active'; // 'active' | 'listening' | 'speaking' | 'thinking' | 'sleeping'
    let _rAngle1    = 0;
    let _rAngle2    = 0;
    let _rAngle3    = 0;
    let _rPulse     = 0;
    let _rParticles = [];
    let _speakingTimer = null;

    function setReactorState(state) {
      _rState = (state || 'active').toLowerCase();
      if (rStatus) {
        if (_rState === 'speaking') {
          rStatus.textContent = 'JARVIS SPEAKING';
          rStatus.style.color = '#00ff88';
          rStatus.style.textShadow = '0 0 10px rgba(0,255,136,0.6)';
        } else if (_rState === 'listening') {
          rStatus.textContent = 'LISTENING';
          rStatus.style.color = '#ff6b00';
          rStatus.style.textShadow = '0 0 10px rgba(255,107,0,0.6)';
        } else if (_rState === 'thinking') {
          rStatus.textContent = 'PROCESSING';
          rStatus.style.color = '#a855f7';
          rStatus.style.textShadow = '0 0 10px rgba(168,85,247,0.6)';
        } else if (_rState === 'sleeping') {
          rStatus.textContent = 'STANDBY';
          rStatus.style.color = '#5e6a7e';
          rStatus.style.textShadow = 'none';
        } else {
          rStatus.textContent = 'JARVIS ONLINE';
          rStatus.style.color = '#00d4ff';
          rStatus.style.textShadow = '0 0 10px rgba(0,212,255,0.5)';
        }
      }
    }

    function _drawReactor() {
      if (!rCtx) return;
      const w  = rCanvas.width;
      const h  = rCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      rCtx.clearRect(0, 0, w, h);

      let spd          = 0.015;
      let primaryColor = '#00d4ff';
      let glowColor    = 'rgba(0,212,255,0.5)';

      if (_rState === 'speaking') {
        spd          = 0.045;
        primaryColor = '#00ff88';
        glowColor    = 'rgba(0,255,136,0.6)';
      } else if (_rState === 'listening') {
        spd          = 0.03;
        primaryColor = '#ff6b00';
        glowColor    = 'rgba(255,107,0,0.6)';
      } else if (_rState === 'thinking') {
        spd          = 0.035;
        primaryColor = '#a855f7';
        glowColor    = 'rgba(168,85,247,0.6)';
      } else if (_rState === 'sleeping') {
        spd          = 0.005;
        primaryColor = '#3a8a9a';
        glowColor    = 'rgba(58,138,154,0.2)';
      }

      _rAngle1 += spd;
      _rAngle2 -= spd * 1.3;
      _rAngle3 += spd * 1.8;
      _rPulse  += spd * 2;

      const scalePulse = 1 + Math.sin(_rPulse) * (_rState === 'speaking' ? 0.08 : 0.03);

      // Outer Radial Glow
      const grad = rCtx.createRadialGradient(cx, cy, 10, cx, cy, 78 * scalePulse);
      grad.addColorStop(0, glowColor);
      grad.addColorStop(0.5, 'rgba(0,212,255,0.08)');
      grad.addColorStop(1, 'transparent');
      rCtx.fillStyle = grad;
      rCtx.beginPath();
      rCtx.arc(cx, cy, 82 * scalePulse, 0, Math.PI * 2);
      rCtx.fill();

      // Outer Tech Segmented Ring
      rCtx.save();
      rCtx.translate(cx, cy);
      rCtx.rotate(_rAngle1);
      rCtx.strokeStyle = primaryColor;
      rCtx.lineWidth   = 2;
      rCtx.setLineDash([12, 8, 4, 8]);
      rCtx.beginPath();
      rCtx.arc(0, 0, 58 * scalePulse, 0, Math.PI * 2);
      rCtx.stroke();
      rCtx.restore();

      // Middle Tech Ring
      rCtx.save();
      rCtx.translate(cx, cy);
      rCtx.rotate(_rAngle2);
      rCtx.strokeStyle = 'rgba(255,255,255,0.45)';
      rCtx.lineWidth   = 1.5;
      rCtx.setLineDash([20, 10, 5, 10]);
      rCtx.beginPath();
      rCtx.arc(0, 0, 46 * scalePulse, 0, Math.PI * 2);
      rCtx.stroke();
      rCtx.restore();

      // Inner Arc Reactor Nodes (8 Spokes)
      rCtx.save();
      rCtx.translate(cx, cy);
      rCtx.rotate(_rAngle3);
      rCtx.strokeStyle = primaryColor;
      rCtx.lineWidth   = 2.2;
      for (let i = 0; i < 8; i++) {
        rCtx.rotate(Math.PI / 4);
        rCtx.beginPath();
        rCtx.moveTo(22 * scalePulse, 0);
        rCtx.lineTo(36 * scalePulse, 0);
        rCtx.stroke();
      }
      rCtx.restore();

      // Glowing Core Ring
      rCtx.save();
      rCtx.beginPath();
      rCtx.arc(cx, cy, 18 * scalePulse, 0, Math.PI * 2);
      rCtx.fillStyle   = primaryColor;
      rCtx.shadowColor = primaryColor;
      rCtx.shadowBlur  = 20;
      rCtx.fill();
      rCtx.restore();

      // Inner White Hot Center
      rCtx.beginPath();
      rCtx.arc(cx, cy, 9 * scalePulse, 0, Math.PI * 2);
      rCtx.fillStyle = '#ffffff';
      rCtx.fill();

      // Particle Sparks (when Speaking or Listening)
      if (_rState === 'speaking' || _rState === 'listening') {
        if (Math.random() < 0.45) {
          const ang  = Math.random() * Math.PI * 2;
          _rParticles.push({
            x: cx + Math.cos(ang) * 15,
            y: cy + Math.sin(ang) * 15,
            vx: Math.cos(ang) * (1 + Math.random() * 2.2),
            vy: Math.sin(ang) * (1 + Math.random() * 2.2),
            alpha: 1.0,
            color: primaryColor
          });
        }
      }

      for (let i = _rParticles.length - 1; i >= 0; i--) {
        const p = _rParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.04;
        if (p.alpha <= 0) {
          _rParticles.splice(i, 1);
          continue;
        }
        rCtx.fillStyle   = p.color;
        rCtx.globalAlpha = p.alpha;
        rCtx.beginPath();
        rCtx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
        rCtx.fill();
        rCtx.globalAlpha = 1.0;
      }

      requestAnimationFrame(_drawReactor);
    }

    _drawReactor();

    if (rCanvas) {
      rCanvas.addEventListener('click', () => {
        doMic();
      });
    }

    // ── Real-time Native JARVIS PCM Audio Stream Player (Web Audio API) ──────
    let _audioPcmCtx = null;
    let _nextPcmTime = 0;

    function _initPcmContext() {
      if (!_audioPcmCtx) {
        try {
          _audioPcmCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        } catch (e) {
          console.error("AudioContext init error:", e);
        }
      }
      if (_audioPcmCtx && _audioPcmCtx.state === 'suspended') {
        _audioPcmCtx.resume();
      }
    }

    function playPcmChunk(arrayBuffer) {
      setReactorState('speaking');
      clearTimeout(_speakingTimer);
      _speakingTimer = setTimeout(() => {
        if (_rState === 'speaking') setReactorState('active');
      }, 500);

      if (!_speakerEnabled) return;
      _initPcmContext();
      if (!_audioPcmCtx) return;

      const int16 = new Int16Array(arrayBuffer);
      if (int16.length === 0) return;

      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      const audioBuffer = _audioPcmCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      const source = _audioPcmCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(_audioPcmCtx.destination);

      const currentTime = _audioPcmCtx.currentTime;
      if (_nextPcmTime < currentTime) {
        _nextPcmTime = currentTime;
      }
      source.start(_nextPcmTime);
      _nextPcmTime += audioBuffer.duration;
    }

    function clearPcmAudio() {
      _nextPcmTime = 0;
      setReactorState('active');
    }

    // ── Live PC Screen Stream & Touch Remote Desktop Control ──────────────────

    function _startScreenStream() {
      _stopScreenStream();
      const fetchFrame = () => {
        if (!_screenStreamActive) return;
        const img = document.getElementById('screen-img');

        const url = `/api/screen/frame?token=${encodeURIComponent(_authToken)}&t=${Date.now()}`;

    let _lastMoveTime   = 0;
    let _touchMoved      = false;
    let _touchStartTime  = 0;
    let _touchStartX     = 0;
    let _touchStartY     = 0;
    let _longPressTimer  = null;
    let _lastTapTime     = 0;

    function _initScreenTouch() {
      const img = document.getElementById('screen-img');
      if (!img || img._touchBound) return;
      img._touchBound = true;

      const sendTouchAction = (clientX, clientY, type) => {
        const rect = img.getBoundingClientRect();
        const normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const normY = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

        const marker = document.getElementById('touch-marker');
        if (marker) {
          marker.style.left = (clientX - rect.left) + 'px';
          marker.style.top  = (clientY - rect.top)  + 'px';
          marker.style.display = 'block';
          if (type === 'right')        marker.style.borderColor = '#ff6b00';
          else if (type === 'double')  marker.style.borderColor = '#22c55e';
          else                         marker.style.borderColor = '#00d4ff';

          if (type !== 'move' && type !== 'drag') {
            setTimeout(() => { marker.style.display = 'none'; }, 300);
          }
        }

        _authFetch('/api/screen/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: normX, y: normY, type: type })
        });
      };

      // Desktop Mouse Click
      img.addEventListener('click', (e) => {
        if (_touchMoved) return;
        sendTouchAction(e.clientX, e.clientY, _touchMode);
      });

      // Mobile Touch Gesture Engine (Instant Tap Click, Double Tap, Long-Press Right Click)
      img.addEventListener('touchstart', (e) => {
        clearTimeout(_longPressTimer);
        _touchMoved = false;
        _touchStartTime = Date.now();

        if (e.touches.length === 1) {
          const t = e.touches[0];
          _touchStartX = t.clientX;
          _touchStartY = t.clientY;

          if (_touchMode === 'drag') {
            _touchMoved = true;
            sendTouchAction(t.clientX, t.clientY, 'down');
          } else {
            _longPressTimer = setTimeout(() => {
              if (!_touchMoved) {
                if ('vibrate' in navigator) navigator.vibrate(40);
                sendTouchAction(_touchStartX, _touchStartY, 'right');
                _touchMoved = true;
                toast('Right Clicked');
              }
            }, 380);
          }
        } else if (e.touches.length === 2) {
          _touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
      }, { passive: true });

      img.addEventListener('touchmove', (e) => {
        const now = Date.now();
        if (e.touches.length === 1) {
          const t = e.touches[0];
          const dist = Math.hypot(t.clientX - _touchStartX, t.clientY - _touchStartY);
          if (dist > 8) {
            _touchMoved = true;
            clearTimeout(_longPressTimer);
          }

          if (now - _lastMoveTime > 35) {
            _lastMoveTime = now;
            sendTouchAction(t.clientX, t.clientY, _touchMode === 'drag' ? 'drag' : 'move');
          }
        } else if (e.touches.length === 2) {
          _touchMoved = true;
          clearTimeout(_longPressTimer);
          if (now - _lastMoveTime > 100) {
            _lastMoveTime = now;
            const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            const diff = _touchStartY - currentY;
            if (Math.abs(diff) > 10) {
              sendScreenScroll(diff > 0 ? 'down' : 'up');
              _touchStartY = currentY;
            }
          }
        }
      }, { passive: true });

      img.addEventListener('touchend', (e) => {
        clearTimeout(_longPressTimer);
        const touchDuration = Date.now() - _touchStartTime;

        if (_touchMode === 'drag' && _touchMoved) {
          if (e.changedTouches.length > 0) {
            const t = e.changedTouches[0];
            sendTouchAction(t.clientX, t.clientY, 'up');
          }
        } else if (!_touchMoved && touchDuration < 380) {
          if (e.changedTouches.length > 0) {
            const t = e.changedTouches[0];
            const now = Date.now();

            let clickType = _touchMode;
            if (now - _lastTapTime < 280) {
              clickType = 'double';
              _lastTapTime = 0;
            } else {
              _lastTapTime = now;
            }

            sendTouchAction(t.clientX, t.clientY, clickType);
            focusMobileKeyboard();
          }
        }
      }, { passive: true });

      _initVirtualKeyboardBridge();
    }

    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';

      return (bytes / 1024 ** 3).toFixed(2) + ' GB';

    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>

          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        setReactorState('listening');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
      setReactorState('active');
    }
  </script>
</body>
</html>
